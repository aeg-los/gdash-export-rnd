# =============================================================================
# Boulder Dash style info screen text definitions
# =============================================================================

bdx_empty_space:		--------------- BOULDER DASH 1 ELEMENTS ----------------

bdx_player:			Rockford, the hero! Collect all diamonds and find the exit!

bdx_sand:			Dirt: You can dig through it

bdx_rock:			Boulder: Smashes enemies and can be pushed by the player

bdx_diamond:			Diamond: Collect enough to finish the cave and enter the exit

bdx_steelwall:			Steel wall: Nothing can go through it

bdx_wall:			Normal wall: You can't go through it, but it can be destroyed

bdx_magic_wall.active:		Magic wall: Changes boulders and diamonds when they pass it

bdx_exit_open:			Exit: Will open after collecting enough diamonds

bdx_amoeba_1:			Amoeba: Turns to boulders or diamonds when too big or when surrounded

bdx_butterfly_1.up:		Butterfly: Moves at the right side of walls; don't touch it!

bdx_firefly_1.up:		Firefly: Moves at the left side of walls; don't touch it!

empty_space:			--------------- BOULDER DASH 2 ELEMENTS ----------------

bdx_slime:			Slime: Boulders and diamonds randomly pass through it

bdx_expandable_wall_horizontal:	Expandable wall: Can grow to the left and to the right

sp_empty_space:			-------------- CONSTRUCTION KIT ELEMENTS ---------------

bdx_invisible_exit_closed:	Hidden exit: Always looks like a normal steel wall

bdx_voodoo_doll:		Voodoo doll: Don't let this come to harm

mm_empty_space:			-------------- NEW BOULDER DASH ELEMENTS ---------------

bdx_clock:			Clock: Gives you extra time when you collect it

bdx_biter:			Biter: Eats dirt and usually diamonds; can push aside rocks

bdx_biter_switch_1:		Biter switch: Controls the speed of biters

bdx_bubble:			Bubble: This slowly rises and can be pushed any way. Becomes a clock if it touches a voodoo doll.

bdx_trapped_bubble:		Trapped bubble: Becomes a bubble when the space above it is free

bdx_bomb:			Bomb: Can be collected and dropped by snapping. Explosion contents vary per cave

bdx_sweet:			Sweet: Once you eat this, all boulders are easy to push, and heavy boulders become pushable

bdx_rock_glued:			Glued elements: Boulders, diamonds, and other Rockfords might be immovable and unusable

bdx_ghost:			Ghost: Explodes into random elements in an X shape when you touch it

bdx_gravestone:			Time penalty: Whenever this spawns, your remaining time goes down

bdx_diamond_key:		Diamond key: Frees all trapped diamonds

bdx_trapped_diamond:		Trapped diamond: Needs a diamond key to free

bdx_waiting_rock:		Chasing boulder: Looks like a normal boulder, but if you let it fall, it starts chasing you

df_empty_space:			----------------- CRAZY DREAM ELEMENTS -----------------

bdx_grass:			Grass: Just like dirt, but looks different

bdx_butterfly_2:		Alternative butterfly: Moves in the opposite direction

bdx_firefly_2:			Alternative firefly: Moves in the opposite direction

bdx_box:			Box: No gravity, and can be snap-pushed

bdx_cow:			Cow: Harmless; if enclosed on all sides, turns into a skeleton

bdx_skeleton:			Skeleton: Collecting enough lets you stir the pot

bdx_pot:			Pot: Stops gravity while stirring, and enables gravity switches

bdx_gravity_switch:		Gravity switch: Changes the level's gravity after a delay

bdx_key_1:			Keys: Each key can open 1 gate of the matching color

bdx_gate_1:			Gates: Can be opened by keys

bdx_pneumatic_hammer:		Pneumatic hammer: Once you collect this, you can mine through walls by snapping sideways above one

bdx_wall_diamond:		Walls with content: Walls may yield diamonds or keys when broken with a pneumatic hammer

bdx_acid:			Acid: Slowly eats through surrounding dirt

bdx_teleporter:			Teleporter: Takes you to another teleporter, depending on which side you enter

bdx_water:			Water: Slowly expands in all directions

bdx_falling_wall:		Falling wall: Looks normal, but falls when you walk under it

invisible_wall:			------------------- GDASH ELEMENTS ---------------------

bdx_grass_ball:			Rolling grass ball: You cannot push it, but you can dig it away

bdx_grass_loose:		Falling grass: Falls but doesn't slip, and you can dig it away

bdx_sand_sloped_up_left:	Sloped elements: Objects can slip off of them, in one direction

bdx_wall_non_sloped:		Non-sloped wall: Looks normal, but isn't slippery

bdx_wall_diggable:		Diggable wall: Looks normal, but you can dig it away

bdx_steelwall_explodable:	Explodable steel wall: Looks normal, but can be destroyed

bdx_steelwall_diggable:		Diggable steel wall: Looks normal, but you can dig it away

bdx_sand_glued:			Glued dirt: Looks normal, but you can't dig it away

bdx_expandable_wall_any:	Expandable wall (horizontal / vertical / any direction): Expandable walls can grow in other directions

bdx_expandable_steelwall_any:	Expandable steel wall (horizontal / vertical / any direction): Steel walls can also expand

bdx_expandable_wall_switch:	Expandable wall switch: Switches what direction expandable walls grow in

bdx_flying_rock:		Flying boulder: Flies upward instead of falling down

bdx_flying_diamond:		Flying diamond: Flies upward instead of falling down

bdx_heavy_rock:			Heavy boulder: Can't be pushed until you get a sweet

bdx_nut:			Nut: Back in time from Emerald Mine. Break it with a rock to get a diamond

bdx_creature_switch:		Creature direction switch: Switches what direction enemies try to turn

bdx_replicator:			Replicator: Objects above this will be replicated below

bdx_replicator_switch:		Replicator switch: Turns replicators on and off

bdx_conveyor_left.active:	Conveyor belt: Moves objects on top of it

bdx_conveyor_switch:		Conveyor belt power switch: Turns conveyor belts on and off

bdx_conveyor_dir_switch:	Conveyor belt direction switch: Reverses conveyor belts

bdx_lava:			Lava: Anything that falls in here is destroyed

bdx_amoeba_2:			Alternative amoeba: Acts independently of regular amoeba, and explodes on contact with it

bdx_stonefly:			Stonefly: Like a butterfly, but explodes into boulders

bdx_dragonfly:			Dragonfly: Like a firefly, but only turns when it runs into something

bdx_nitro_pack:			Nitro pack: If you drop this on something other than dirt, it explodes

bdx_rocket_launcher:		Rocket launcher: Collect this and you can fire rockets

invisible_steelwall:		-------------------- MISCELLANEOUS ---------------------

bdx_light_rock:			Light boulder: Can always be pushed immediately

bdx_rocket:			Rocket: Additional ammo for the rocket launcher

bdx_diamond.falling:		Effects: The simplest rules of Boulder Dash may turn false in some caves
